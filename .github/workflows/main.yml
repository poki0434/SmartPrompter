name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Offline Speech Model & Sherpa-ONNX AAR
        run: |
          if [ -d "SmartPrompter_Android" ]; then
            cd SmartPrompter_Android
          fi
          mkdir -p app/libs app/src/main/assets
          curl -fsSL "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.12.23/sherpa-onnx-1.12.23.aar" -o app/libs/sherpa-onnx.aar
          curl -fsSL "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-streaming-zipformer-zh-14M-2023-02-23.tar.bz2" -o model.tar.bz2
          tar xjf model.tar.bz2 -C app/src/main/assets/
          rm -f model.tar.bz2
          ls -lh app/libs/sherpa-onnx.aar

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'
          cache-disabled: true

      - name: Build APK
        run: |
          if [ -d "SmartPrompter_Android" ]; then
            cd SmartPrompter_Android
          fi
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartPrompter-Release-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.smartprompter.app'
    compileSdk 34

    signingConfigs {
        smartConfig {
            storeFile file('smartprompter.jks')
            storePassword 'smartprompter123'
            keyAlias 'smartprompter'
            keyPassword 'smartprompter123'
        }
    }

    defaultConfig {
        applicationId "com.smartprompter.app"
        minSdk 21
        targetSdk 34
        versionCode 9
        versionName "1.9.0"
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.smartConfig
        }
        release {
            signingConfig signingConfigs.smartConfig
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.media:media:1.7.0'
}
